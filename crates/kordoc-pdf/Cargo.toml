[package]
name = "kordoc-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
pdfjs-v8 = ["dep:v8", "dep:serde", "dep:serde_json", "dep:unicode-normalization"]
pdfjs-worker-tests = ["pdfjs-v8"]

[[bin]]
name = "pdfjs-worker"
path = "src/bin/pdfjs_worker.rs"
required-features = ["pdfjs-v8"]
test = false

[[bin]]
name = "pdfjs-test-worker"
path = "tests/support/worker_child.rs"
required-features = ["pdfjs-worker-tests"]
test = false

[dependencies]
kordoc-ir = { path = "../kordoc-ir", version = "=0.1.0" }
lopdf.workspace = true
v8 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
unicode-normalization = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true
