name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install development environment
        run: |
          python -m pip install uv==0.10.0
          uv sync --python 3.10 --all-groups --locked
          uv run maturin develop
      - name: Run contract tests
        run: uv run pytest tests/contracts -q

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo +1.97.0 fmt --all -- --check
      - name: Run Clippy
        run: cargo +1.97.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run Rust tests
        run: cargo +1.97.0 test --workspace --locked
      - name: Test embedded PDF.js runtime and native worker supervision
        run: cargo +1.97.0 test -p kordoc-pdf --features pdfjs-worker-tests --locked
      - name: Build warning-free documentation
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo +1.97.0 doc --workspace --no-deps --locked

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development environment
        run: |
          python -m pip install uv==0.10.0
          uv sync --python "${{ matrix.python-version }}" --all-groups --locked
          uv run maturin develop
      - name: Test Python API
        run: uv run pytest tests/python tests/parity -q
      - name: Lint Python
        run: uv run ruff check python tests scripts
      - name: Check Python formatting
        run: uv run ruff format --check python tests scripts
      - name: Type-check Python package
        run: uv run mypy python/kordoc scripts

  golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.15.0
          args: --release --locked --out dist
          manylinux: 2_28
      - name: Test committed goldens from installed wheel
        run: |
          python -m pip install dist/*.whl pytest==9.0.3
          python -m pytest tests/parity -q

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Check documentation links and indexes
        run: python scripts/check_docs.py

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install coverage tooling
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component llvm-tools-preview
          cargo +1.97.0 install cargo-llvm-cov --version 0.9.1 --locked
      - name: Enforce foundation coverage
        run: cargo +1.97.0 llvm-cov -p kordoc-ir -p kordoc-core -p kordoc-tables --locked --fail-under-lines 80 --lcov --output-path lcov.info
      - name: Generate HTML report
        run: cargo +1.97.0 llvm-cov report --html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-coverage-${{ github.sha }}
          path: |
            lcov.info
            target/llvm-cov/html
          if-no-files-found: error

  ci-gate:
    if: ${{ always() }}
    needs: [contracts, rust, python, golden, docs, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI dependency to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
