name: Security

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "31 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [rust, python, actions]
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  cargo-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit 0.22.2
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-audit@0.22.2
          checksum: true
          fallback: none
      - name: Audit locked dependencies
        run: cargo audit --file Cargo.lock

  cargo-deny:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny 0.20.2
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-deny@0.20.2
          checksum: true
          fallback: none
      - name: Check dependency policy
        run: cargo deny --locked check

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    steps:
      - name: Review pull request dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12 from checksum-verified release artifact
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          destination="$RUNNER_TEMP/actionlint"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check --status
          mkdir -p "$destination"
          tar --extract --gzip --file "$archive" --directory "$destination" actionlint
          echo "$destination" >> "$GITHUB_PATH"
      - name: Lint workflows
        run: actionlint .github/workflows/*.yml

  zizmor:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor 1.30.1
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: zizmor@1.30.1
          checksum: true
          fallback: none
      - name: Audit workflows
        run: zizmor .github/workflows

  security-gate:
    if: always()
    needs: [codeql, cargo-audit, cargo-deny, dependency-review, actionlint, zizmor]
    runs-on: ubuntu-24.04
    steps:
      - name: Report security gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if jq -e 'all(.[]; .result == "success")' <<< "$RESULTS" >/dev/null; then
            echo "All required security checks passed."
          else
            echo "At least one required security check failed or was skipped." >&2
            exit 1
          fi
