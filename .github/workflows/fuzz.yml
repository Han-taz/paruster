name: Bounded fuzzing

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [detect_format, zip_preflight]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-09-20 --profile minimal
          cargo +nightly-2026-09-20 install cargo-fuzz --version 0.13.2 --locked
      - name: Run pull-request campaign
        if: ${{ github.event_name != 'schedule' }}
        working-directory: fuzz
        run: cargo +nightly-2026-09-20 fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} -- -max_total_time=30
      - name: Run weekly campaign
        if: ${{ github.event_name == 'schedule' }}
        working-directory: fuzz
        run: cargo +nightly-2026-09-20 fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} -- -max_total_time=900
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.sha }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  fuzz-gate:
    if: ${{ always() }}
    needs: [fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every fuzz dependency to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
