name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require dispatch from the main branch
        run: test "$GITHUB_REF" = refs/heads/main

  build-wheels:
    name: candidate wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: 2_28
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: 2_28
          - id: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: "off"
          - id: windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            manylinux: "off"
          - id: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
          - id: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: "off"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: [guard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Audit, scan, and install the exact wheel
        shell: bash
        run: >-
          python -c "import pathlib, subprocess, sys, venv;
          wheels=list(pathlib.Path('dist').glob('*.whl'));
          assert len(wheels) == 1 and 'cp310-abi3' in wheels[0].name, wheels;
          subprocess.check_call([sys.executable, 'scripts/check_artifacts.py', str(wheels[0])]);
          venv.create('.venv-rc', with_pip=True);
          exe=pathlib.Path('.venv-rc') / ('Scripts/python.exe' if sys.platform == 'win32' else 'bin/python');
          subprocess.check_call([str(exe), '-m', 'pip', 'install', str(wheels[0]), 'pytest==8.4.2']);
          subprocess.check_call([str(exe), '-m', 'pytest', 'tests/python/test_import.py', 'tests/python/test_error_mapping.py', 'tests/parity/test_golden.py', '-q'])"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-wheel-${{ matrix.id }}-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [guard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          maturin-version: v1.15.0
          args: --out dist
      - name: Scan and install the exact source distribution
        run: |
          python scripts/check_artifacts.py dist/*.tar.gz
          python -m venv .venv-sdist
          .venv-sdist/bin/python -m pip install dist/*.tar.gz
          .venv-sdist/bin/python -c "import kordoc; assert kordoc.detect_format(bytes.fromhex('255044462d')) == 'pdf'"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-sdist-${{ github.sha }}
          path: dist/*.tar.gz
          if-no-files-found: error

  sboms:
    needs: [guard, build-wheels, build-sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        artifact:
          - rc-wheel-linux-x86_64
          - rc-wheel-linux-aarch64
          - rc-wheel-windows-x86_64
          - rc-wheel-windows-aarch64
          - rc-wheel-macos-x86_64
          - rc-wheel-macos-aarch64
          - rc-sdist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: subject
      - name: Resolve immutable subject
        id: subject
        shell: bash
        run: |
          test "$(find subject -maxdepth 1 -type f | wc -l | tr -d ' ')" = 1
          mkdir -p sbom
          echo "path=$(find subject -maxdepth 1 -type f -print -quit)" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ${{ steps.subject.outputs.path }}
          format: spdx-json
          output-file: sbom/${{ matrix.artifact }}.spdx.json
          artifact-name: ${{ matrix.artifact }}.spdx.json
          syft-version: v1.52.0
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ${{ steps.subject.outputs.path }}
          format: cyclonedx-json
          output-file: sbom/${{ matrix.artifact }}.cyclonedx.json
          artifact-name: ${{ matrix.artifact }}.cyclonedx.json
          syft-version: v1.52.0
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.artifact }}-${{ github.sha }}
          path: sbom/*.json
          if-no-files-found: error

  checksums:
    needs: [guard, build-wheels, build-sdist, sboms]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rc-*
          path: bundle
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*
          path: bundle
          merge-multiple: true
      - name: Generate deterministic SHA-256 manifest
        working-directory: bundle
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path

          expected_stems = {
              "rc-wheel-linux-x86_64",
              "rc-wheel-linux-aarch64",
              "rc-wheel-windows-x86_64",
              "rc-wheel-windows-aarch64",
              "rc-wheel-macos-x86_64",
              "rc-wheel-macos-aarch64",
              "rc-sdist",
          }
          expected_sboms = {
              f"{stem}.{kind}.json"
              for stem in expected_stems
              for kind in ("spdx", "cyclonedx")
          }
          actual_sboms = {path.name for path in Path(".").glob("*.json")}
          distributions = [*Path(".").glob("*.whl"), *Path(".").glob("*.tar.gz")]
          assert len(distributions) == 7, distributions
          assert actual_sboms == expected_sboms, (actual_sboms, expected_sboms)
          PY
          printf '%s\n' "$SOURCE_COMMIT" > SOURCE_COMMIT
          manifest="$RUNNER_TEMP/SHA256SUMS"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$manifest"
          mv "$manifest" SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-checksums-${{ github.sha }}
          path: |
            bundle/SHA256SUMS
            bundle/SOURCE_COMMIT
          if-no-files-found: error

  attest:
    needs: [guard, build-wheels, build-sdist, sboms, checksums]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rc-*
          path: bundle
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*
          path: bundle
          merge-multiple: true
      - name: Verify the complete candidate manifest before signing
        working-directory: bundle
        run: sha256sum -c SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: bundle/**/*
