[advisories]
version = 2
# Vulnerability and unsound advisories are errors by default in cargo-deny 0.20.
unmaintained = "all"
unsound = "all"
yanked = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    { crate = "syn@2.0.119", reason = "PyO3's current proc-macro graph requires syn 2 alongside syn 3." },
    { crate = "syn@3.0.6", reason = "serde and thiserror derive dependencies currently require syn 3 alongside syn 2." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

# This build-time crate is permissively licensed; the exception is limited to its exact locked version.
[[licenses.exceptions]]
crate = "target-lexicon@0.13.5"
allow = ["Apache-2.0 WITH LLVM-exception"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
