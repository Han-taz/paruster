[workspace]
members = [
    "crates/kordoc-ir",
    "crates/kordoc-core",
    "crates/kordoc-hancom",
    "crates/kordoc-pdf",
    "crates/kordoc-python",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
pyo3 = "0.29.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0", features = ["unbounded_depth"] }
thiserror = "2.0.21"
zip = { version = "8", default-features = false, features = ["deflate"] }
cfb = "0.15.0"
proptest = "1.11.0"
quick-xml = { version = "=0.42.0", default-features = false }
aes = "=0.9.3"
cbc = "=0.2.1"
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
sha1 = { version = "=0.11.0", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
lopdf = { version = "=0.45.0", default-features = false }
regex = "=1.13.1"
