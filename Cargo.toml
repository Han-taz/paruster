[workspace]
members = ["crates/kordoc-ir", "crates/kordoc-core", "crates/kordoc-python"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
pyo3 = "0.29.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"
zip = { version = "8", default-features = false, features = ["deflate"] }
cfb = "0.15.0"
proptest = "1.11.0"
