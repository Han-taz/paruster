[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "kordoc"
version = "0.1.0"
description = "Rust document-processing core with a Python API"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[dependency-groups]
dev = [
    "maturin==1.15.0",
    "pytest==9.0.3",
    "jsonschema==4.25.1",
    "ruff==0.16.9",
    "mypy==1.19.1",
]

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/kordoc-python/Cargo.toml"
module-name = "kordoc._native"
python-source = "python"
features = ["extension-module"]
